# Configurazione preliminare Fase 7 - PPO
# Integrare nella configurazione principale quando la pipeline definitiva
# viene stabilizzata.

agent:
  algorithm: PPO
  learning_rate: 0.0003
  batch_size: 256
  n_steps: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.20
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  total_timesteps: 250000

environment:
  initial_balance: 100000.0
  positions:
    - -1
    - 0
    - 1
  commission_rate: 0.0001
  spread_rate: 0.0002
  slippage_rate: 0.00005
  turnover_penalty: 0.0001
  max_episode_steps: 5000
  turnover_reward_weight: 0.0
