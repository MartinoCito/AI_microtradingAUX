name: Phase 5 Baselines

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install pandas numpy pyyaml matplotlib pyarrow pytest
      - name: Run tests
        run: pytest -q
      - name: Generate Phase 5 reports
        run: python baselines.py
      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/baselines.csv reports/figures/baseline_equity.png
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Generate Phase 5 baseline reports"
            git push
          fi
