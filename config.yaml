project:
  name: microtradingAUXRL
  seed: 42

data:
  raw_path: data/raw/XAU_1m_data.csv
  processed_directory: data/processed
  m15_path: data/processed/xauusd_m15.parquet

  separator: ";"
  timestamp_column: Date
  timestamp_format: "%Y.%m.%d %H:%M"

  open_column: Open
  high_column: High
  low_column: Low
  close_column: Close
  volume_column: Volume

  expected_frequency: "1min"

  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15

  duplicate_policy: "keep_last"
  invalid_row_policy: "raise"

features:
  window_size: 60

  return_windows:
    - 1
    - 5
    - 15
    - 30
    - 60

  volatility_windows:
    - 10
    - 30
    - 60

  moving_average_windows:
    - 10
    - 30
    - 60

  normalize: true

environment:
  initial_balance: 100000.0

  positions:
    - -1
    - 0
    - 1

  commission_rate: 0.0001
  spread_rate: 0.0002
  slippage_rate: 0.00005
  turnover_penalty: 0.0001

  max_episode_steps: 5000

agent:
  algorithm: PPO
  learning_rate: 0.0003
  batch_size: 256
  n_steps: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.20
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_hidden_layers:
    - 128
    - 128
  total_timesteps: 250000
  train_fraction: 0.25
  seeds:
    - 42
    - 43
    - 44
  eval_freq: 25000
  checkpoint_freq: 25000
  device: cpu
  deterministic_validation: true
  degeneracy_threshold: 0.99
  torch_threads: 1
  comparison_steps: 5000
  acceptance:
    # Fixed before the corrected experiment; prototype stability, not profit.
    max_mean_window_return_range: 0.10
    max_action_share_range: 0.20

evaluation:
  deterministic: true
  risk_free_rate: 0.0

resampling:
  target_rule: "15min"
  source_bar_duration: "1min"
  min_coverage_ratio: 1.0
  broker_timestamp_convention: "open"

walk_forward:
  phase7_report: reports/ppo_prototype/phase7_corrected_20260929/summary.json
  n_folds: 4
  train_years: 5
  validation_months: 6
  test_months: 6
  total_timesteps: 250000
  eval_freq: 25000
  checkpoint_freq: 25000
  seed: 42
  max_positive_pnl_share: 0.50
  min_positive_fold_fraction: 0.50
